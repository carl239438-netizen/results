<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة تسجيل البيانات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d9488;
            --primary-hover: #0f766e;
            --btn-secondary: #0284c7;
            --btn-secondary-hover: #0369a1;
            --card-bg: rgba(255, 255, 255, 0.95);
            --border-color: #cbd5e1;
            --text-main: #1e293b;
            --text-label: #334155;
            --bg-page: #e2e8f0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-page);
            background-image: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            color: var(--text-main);
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 1100px;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        .header-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }

        /* مساحة الصورة */
        .photo-upload-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        .photo-preview {
            width: 110px;
            height: 130px;
            border: 2px dashed #94a3b8;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 10px;
            background-color: #f8fafc;
            overflow: hidden;
            text-align: center;
        }

        .file-btn {
            background-color: #16a34a;
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .file-btn:hover { background-color: #15803d; }
        input[type="file"] { display: none; }

        /* الشبكة وتوزيع الحقول */
        .grid-row {
            display: grid;
            gap: 15px;
            margin-bottom: 18px;
        }

        .cols-5 { grid-template-columns: repeat(5, 1fr); }
        .cols-3 { grid-template-columns: repeat(3, 1fr); }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-label);
        }

        .form-control {
            width: 100%;
            padding: 9px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus { border-color: var(--primary-color); }

        /* التعهدات */
        .terms-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 6px;
            margin-top: 30px;
            margin-bottom: 25px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: #475569;
            font-weight: 700;
        }

        .checkbox-group:last-child { margin-bottom: 0; }
        .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }

        /* الأزرار */
        .actions-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            font-family: 'Tajawal', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 12px 40px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit { background-color: var(--primary-color); color: white; }
        .btn-submit:hover { background-color: var(--primary-hover); }
        
        .btn-print { background-color: var(--btn-secondary); color: white; }
        .btn-print:hover { background-color: var(--btn-secondary-hover); }

        /* استجابة الموبايل */
        @media (max-width: 768px) {
            .cols-5, .cols-3 { grid-template-columns: 1fr; }
            .photo-upload-container { align-items: center; }
        }

        /* الطباعة */
        @media print {
            body { background: none; padding: 0; }
            .form-card { box-shadow: none; border: 2px solid #000; padding: 20px; }
            .actions-group, .file-btn { display: none; }
            .form-control { border: 1px solid #000; appearance: none; -webkit-appearance: none; }
            select.form-control { background-image: none; } /* إخفاء سهم القائمة المنسدلة عند الطباعة */
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h1 class="header-title">استمارة تسجيل البيانات</h1>

        <!-- مساحة الصورة -->
        <div class="photo-upload-container">
            <div class="photo-preview" id="previewBox">تحميل<br>الملف</div>
            <label class="file-btn">
                اختر ملف
                <input type="file" accept="image/*" onchange="loadFile(event)">
            </label>
        </div>

        <form id="registrationForm" onsubmit="event.preventDefault(); alert('تم تسجيل البيانات!');">
            
            <!-- الصف 1: الاسم خماسي -->
            <div class="grid-row cols-5">
                <div class="form-group"><label>الاسم الأول:</label><input type="text" class="form-control" required></div>
                <div class="form-group"><label>الاسم الثاني:</label><input type="text" class="form-control" required></div>
                <div class="form-group"><label>الاسم الثالث:</label><input type="text" class="form-control" required></div>
                <div class="form-group"><label>الاسم الرابع:</label><input type="text" class="form-control"></div>
                <div class="form-group"><label>اللقب:</label><input type="text" class="form-control"></div>
            </div>

            <!-- الصف 2 -->
            <div class="grid-row cols-3">
                <div class="form-group"><label>اسم الأم الثلاثي:</label><input type="text" class="form-control"></div>
                <div class="form-group"><label>المسقط (مكان الولادة):</label><input type="text" class="form-control"></div>
                <div class="form-group">
                    <label>الجنس:</label>
                    <select class="form-control">
                        <option>ذكر</option>
                        <option>أنثى</option>
                    </select>
                </div>
            </div>

            <!-- الصف 3 -->
            <div class="grid-row cols-3">
                <div class="form-group"><label>تاريخ الميلاد:</label><input type="date" class="form-control"></div>
                <div class="form-group"><label>رقم الهاتف:</label><input type="number" class="form-control"></div>
                <div class="form-group"><label>رقم هاتف ولي الأمر:</label><input type="number" class="form-control"></div>
            </div>

            <!-- الصف 4 -->
            <div class="grid-row cols-3">
                <div class="form-group"><label>البريد الإلكتروني:</label><input type="email" class="form-control"></div>
                <div class="form-group"><label>محافظة السكن الحالي:</label><input type="text" class="form-control"></div>
                <div class="form-group"><label>العنوان مع أقرب نقطة دالة:</label><input type="text" class="form-control"></div>
            </div>

            <!-- الصف 5 -->
            <div class="grid-row cols-3">
                <div class="form-group"><label>رقم البطاقة الوطنية:</label><input type="text" class="form-control"></div>
                <div class="form-group"><label>جهة اصدار البطاقة الوطنية:</label><input type="text" class="form-control"></div>
                <div class="form-group"><label>تاريخ اصدار البطاقة الوطنية:</label><input type="date" class="form-control"></div>
            </div>

            <!-- الصف 6: تأييد السكن -->
            <div class="grid-row cols-3">
                <div class="form-group"><label>رقم (عدد) تأييد السكن:</label><input type="text" class="form-control"></div>
                <div class="form-group"><label>جهة إصدار تأييد السكن:</label><input type="text" class="form-control"></div>
                <div class="form-group"><label>تاريخ إصدار تأييد السكن:</label><input type="date" class="form-control"></div>
            </div>

            <!-- الصف 7 -->
            <div class="grid-row cols-3">
                <div class="form-group"><label>مكان عمل الاب:</label><input type="text" class="form-control"></div>
                <div class="form-group">
                    <label>فصيلة الدم:</label>
                    <select class="form-control">
                        <option>O+</option><option>O-</option><option>A+</option><option>A-</option>
                        <option>B+</option><option>B-</option><option>AB+</option><option>AB-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الفرع الاعدادي:</label>
                    <select class="form-control">
                        <option>علمي</option><option>أدبي</option><option>مهني</option><option>أخرى</option>
                    </select>
                </div>
            </div>

            <!-- الصف 8 -->
            <div class="grid-row cols-3">
                <div class="form-group"><label>اسم الاعدادية:</label><input type="text" class="form-control"></div>
                <div class="form-group">
                    <label>سنة التخرج من الاعدادية:</label>
                    <select class="form-control">
                        <option>2025-2026</option>
                        <option>2024-2025</option>
                        <option>2023-2024</option>
                        <option>2022-2023</option>
                        <option>2021-2022</option>
                        <option>2020-2021</option>
                    </select>
                </div>
                <div class="form-group"><label>تخصص المعهد او المهني ان وجد:</label><input type="text" class="form-control"></div>
            </div>

            <!-- الصف 9 -->
            <div class="grid-row cols-3">
                <div class="form-group"><label>الرقم الامتحاني:</label><input type="number" class="form-control"></div>
                <div class="form-group">
                    <label>نوع الدراسة:</label>
                    <select class="form-control">
                        <option>دراسة صباحية</option><option>دراسة مسائية</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الدور:</label>
                    <select class="form-control">
                        <option>الدور الأول</option><option>الدور الثاني</option><option>الدور الثالث</option>
                    </select>
                </div>
            </div>

            <!-- الصف 10 -->
            <div class="grid-row cols-3">
                <div class="form-group"><label>المجموع قبل الاضافة:</label><input type="number" class="form-control"></div>
                <div class="form-group"><label>عدد المواد:</label><input type="number" class="form-control"></div>
                <div class="form-group"><label>المعدل قبل الاضافة:</label><input type="number" step="0.01" class="form-control"></div>
            </div>

            <!-- الصف 11 -->
            <div class="grid-row cols-3">
                <div class="form-group"><label>درجة اللغات الاخرى ان وجدت:</label><input type="number" class="form-control"></div>
                <div class="form-group"><label>المعدل بعد الاضافة:</label><input type="number" step="0.01" class="form-control"></div>
                <div class="form-group">
                    <label>هل أنت من أبناء الأساتذة:</label>
                    <select class="form-control">
                        <option>كلا</option><option>نعم</option>
                    </select>
                </div>
            </div>

            <!-- الصف 12: القسم وسنة القبول وقناة القبول -->
            <div class="grid-row cols-3">
                <div class="form-group">
                    <label>القسم العلمي:</label>
                    <select class="form-control">
                        <option>الهندسة المدنية</option>
                        <option>الهندسة الميكانيكية</option>
                        <option>الهندسة الكهربائية</option>
                        <option>هندسة الأطراف والمساند الصناعية</option>
                        <option>هندسة الطب الحياتي</option>
                        <option>هندسة العمارة</option>
                        <option>هندسة النفط</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>سنة القبول:</label>
                    <select class="form-control">
                        <option>2026-2027</option>
                        <option>2025-2026</option>
                        <option>2024-2025</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>قناة القبول:</label>
                    <select class="form-control">
                        <option>القبول المركزي</option><option>الموازي</option><option>المسائي</option><option>أخرى</option>
                    </select>
                </div>
            </div>

            <!-- التعهدات -->
            <div class="terms-box">
                <div class="checkbox-group">
                    <input type="checkbox" id="c1" required>
                    <label for="c1">أتعهد بصحة المعلومات وبخلافه أتحمل كافة التبعات الإدارية والقانونية.</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="c2" required>
                    <label for="c2">أتعهد بتسليم جميع المستمسكات المطلوبة في التسجيل وبخلافه أتحمل كافة التبعات.</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="c3" required>
                    <label for="c3">أتعهد بالالتزام بكافة التعليمات والضوابط الخاصة بإجراءات التسجيل.</label>
                </div>
            </div>

            <!-- الأزرار -->
            <div class="actions-group">
                <button type="submit" class="btn btn-submit">تسجيل وطباعة</button>
                <button type="button" class="btn btn-print" onclick="window.print()">طباعة</button>
            </div>

        </form>
    </div>

    <script>
        function loadFile(event) {
            const preview = document.getElementById('previewBox');
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}" style="width:100%; height:100%; object-fit:cover;">`;
                }
                reader.readAsDataURL(file);
            }
        }
    </script>

</body>
</html>
